name: Package ChatGPT Web Skills

on:
  push:
    branches:
      - skill-packaging-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4
        with:
          ref: skill-packaging-build
          path: packaging

      - name: Checkout marketing skills source
        uses: actions/checkout@v4
        with:
          repository: GP1509/marketingskills
          ref: chatgpt-web
          path: marketing

      - name: Checkout social media skills source
        uses: actions/checkout@v4
        with:
          repository: GP1509/social-media-skills
          ref: chatgpt-web
          path: social

      - name: Build curated skill directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work dist

          compatibility_patch() {
            local dst="$1"
            python - "$dst" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          for p in root.rglob('*.md'):
              text = p.read_text(encoding='utf-8')
              text = re.sub(
                  r'\[([^\]]+)\]\((?:\.\./)+tools/[^)]+\)',
                  r'\1 (optional integration; use only when actually available in the current ChatGPT environment)',
                  text,
              )
              text = re.sub(
                  r'\[(`?pricing`?)\]\((?:\.\./)+pricing/SKILL\.md\)',
                  r'\1 (optional separate Skill; install only when needed)',
                  text,
              )
              p.write_text(text, encoding='utf-8')
          PY
          }

          prepare_skill() {
            local src="$1"
            local license="$2"
            local name="$3"
            local dst="work/$name"
            rm -rf "$dst"
            mkdir -p "$dst"
            cp -a "$src"/. "$dst"/
            rm -rf "$dst/evals" "$dst/.DS_Store"
            cp "$license" "$dst/LICENSE"
            test -f "$dst/SKILL.md"
            compatibility_patch "$dst"
          }

          prepare_skill marketing/skills/product-marketing marketing/LICENSE product-marketing
          prepare_skill marketing/skills/customer-research marketing/LICENSE customer-research
          prepare_skill marketing/skills/site-architecture marketing/LICENSE site-architecture
          prepare_skill marketing/skills/copywriting marketing/LICENSE copywriting
          prepare_skill marketing/skills/copy-editing marketing/LICENSE copy-editing
          prepare_skill marketing/skills/cro marketing/LICENSE cro
          prepare_skill marketing/skills/offers marketing/LICENSE offers
          prepare_skill marketing/skills/marketing-psychology marketing/LICENSE marketing-psychology
          prepare_skill marketing/skills/seo-audit marketing/LICENSE seo-audit
          prepare_skill marketing/skills/ai-seo marketing/LICENSE ai-seo
          prepare_skill marketing/skills/schema marketing/LICENSE schema
          prepare_skill marketing/skills/content-strategy marketing/LICENSE content-strategy
          prepare_skill marketing/skills/social marketing/LICENSE social
          prepare_skill marketing/skills/analytics marketing/LICENSE analytics
          prepare_skill social/skills/voice-builder social/LICENSE voice-builder
          prepare_skill social/skills/content-matrix social/LICENSE content-matrix

      - name: Validate with official Agent Skills reference library
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/agentskills/agentskills.git /tmp/agentskills
          python3 -m venv /tmp/skills-ref-venv
          /tmp/skills-ref-venv/bin/pip install -q -e /tmp/agentskills/skills-ref
          for skill_dir in work/*; do
            echo "Validating $skill_dir"
            /tmp/skills-ref-venv/bin/skills-ref validate "$skill_dir"
          done

      - name: Package spec-compliant skill bundles
        shell: bash
        run: |
          set -euo pipefail

          package_skill() {
            local num="$1"
            local name="$2"
            # Agent Skills are directories. Keep the skill directory as the top-level
            # entry inside the uploaded archive instead of putting SKILL.md at archive root.
            (cd work && zip -qr "../dist/${num}-${name}.skill" "$name" -x '*.DS_Store')
          }

          package_skill 01 product-marketing
          package_skill 02 customer-research
          package_skill 03 site-architecture
          package_skill 04 copywriting
          package_skill 05 copy-editing
          package_skill 06 cro
          package_skill 07 offers
          package_skill 08 marketing-psychology
          package_skill 09 seo-audit
          package_skill 10 ai-seo
          package_skill 11 schema
          package_skill 12 content-strategy
          package_skill 13 social
          package_skill 14 analytics
          package_skill 15 voice-builder
          package_skill 16 content-matrix

          cat > dist/LEIA-ME.txt <<'EOF'
          CHATGPT WEB — SKILLS DE MARKETING E SOCIAL

          PACOTES RECONSTRUÍDOS NO PADRÃO AGENT SKILLS.
          Cada .skill contém uma pasta de Skill na raiz e, dentro dela, o SKILL.md e seus recursos.
          O ZIP mestre serve apenas para transporte. Não envie o ZIP mestre como uma única Skill.

          Antes de instalar esta revisão, remova versões anteriores das mesmas Skills para evitar colisões de nome.

          BLOCO 1 — Fundação
          01 product-marketing
          02 customer-research
          15 voice-builder

          BLOCO 2 — Sites e conversão
          03 site-architecture
          07 offers
          04 copywriting
          05 copy-editing
          06 cro
          08 marketing-psychology

          BLOCO 3 — SEO e mensuração
          09 seo-audit
          10 ai-seo
          11 schema
          14 analytics

          BLOCO 4 — Conteúdo e social
          12 content-strategy
          13 social
          16 content-matrix

          Fontes:
          GP1509/marketingskills @ chatgpt-web
          GP1509/social-media-skills @ chatgpt-web

          Validação:
          Todos os 16 diretórios são validados com a biblioteca oficial skills-ref antes do empacotamento.
          EOF

          python3 - <<'PY'
          import pathlib, re, zipfile, sys
          dist = pathlib.Path('dist')
          expected = {
            '01-product-marketing.skill':'product-marketing',
            '02-customer-research.skill':'customer-research',
            '03-site-architecture.skill':'site-architecture',
            '04-copywriting.skill':'copywriting',
            '05-copy-editing.skill':'copy-editing',
            '06-cro.skill':'cro',
            '07-offers.skill':'offers',
            '08-marketing-psychology.skill':'marketing-psychology',
            '09-seo-audit.skill':'seo-audit',
            '10-ai-seo.skill':'ai-seo',
            '11-schema.skill':'schema',
            '12-content-strategy.skill':'content-strategy',
            '13-social.skill':'social',
            '14-analytics.skill':'analytics',
            '15-voice-builder.skill':'voice-builder',
            '16-content-matrix.skill':'content-matrix',
          }
          errors=[]
          for fn,name in expected.items():
              p=dist/fn
              if not p.exists():
                  errors.append(f'missing package: {fn}'); continue
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  if bad: errors.append(f'{fn}: corrupt member {bad}')
                  names=set(z.namelist())
                  skill_md=f'{name}/SKILL.md'
                  license_file=f'{name}/LICENSE'
                  if skill_md not in names:
                      errors.append(f'{fn}: missing {skill_md}'); continue
                  if license_file not in names:
                      errors.append(f'{fn}: missing {license_file}')
                  if 'SKILL.md' in names:
                      errors.append(f'{fn}: invalid root-level SKILL.md')
                  text=z.read(skill_md).decode('utf-8')
                  m=re.search(r'^---\s*\n(.*?)\n---', text, re.S)
                  if not m:
                      errors.append(f'{fn}: missing YAML frontmatter'); continue
                  front=m.group(1)
                  nm=re.search(r'^name:\s*["\']?([^"\'\n]+)', front, re.M)
                  if not nm or nm.group(1).strip()!=name:
                      errors.append(f'{fn}: name does not match parent directory')
                  if any(x.startswith(f'{name}/evals/') for x in names):
                      errors.append(f'{fn}: evals included')
          if errors:
              print('\n'.join('ERROR: '+e for e in errors))
              sys.exit(1)
          print(f'Validated archive structure for {len(expected)} skill packages successfully.')
          PY

          (cd dist && zip -q marketing-social-skills-chatgpt-web-v2.zip *.skill LEIA-ME.txt)
          unzip -t dist/marketing-social-skills-chatgpt-web-v2.zip

      - name: Upload packaged skills
        uses: actions/upload-artifact@v4
        with:
          name: marketing-social-skills-chatgpt-web-v2
          path: dist/
          if-no-files-found: error
          retention-days: 30
